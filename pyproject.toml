[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finreg"
version = "0.1.0"
description = "Evidence-based Korean financial regulation research assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]
model = [
    "torch==2.10.0",
    "transformers>=4.57,<5",
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.48,<0.50",
    "peft>=0.18,<0.19",
    "psutil>=7,<8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/finreg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
