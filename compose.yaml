services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: finreg
      POSTGRES_USER: finreg
      POSTGRES_PASSWORD: ${FINREG_POSTGRES_PASSWORD:?Set FINREG_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - finreg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreg -d finreg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finreg_pgdata:
